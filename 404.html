<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#111111" />
<title>Private preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  form { width: 100%; max-width: 340px; display: grid; gap: 12px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 500; letter-spacing: .02em; color: #f2f2f2; }
  p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: #8a8a8a; }
  input { width: 100%; height: 52px; border-radius: 999px; border: 1px solid #333; background: #181818; color: #f2f2f2; font: inherit; font-size: 17px; padding: 0 20px; outline: none; text-align: center; }
  input:focus { border-color: #777; }
  button { width: 100%; height: 52px; border-radius: 999px; border: 0; background: #f2f2f2; color: #111; font: inherit; font-size: 16px; font-weight: 600; }
  button:disabled { opacity: .5; }
  .err { color: #e8a598; font-size: 13.5px; min-height: 20px; }
</style>
</head><body><main><form id="f" autocomplete="off">
  <h1>Private preview</h1>
  <p>Enter the passphrase you were given.</p>
  <input id="pw" type="password" placeholder="Passphrase" aria-label="Passphrase" autocapitalize="none" autocorrect="off" spellcheck="false" />
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form></main>
<script>
const BASE = "/preview-06b9c1/", SALT = "2H6XZibYmQoB7ahQ7n4QGQ==", ITER = 600000;
const $ = (id) => document.getElementById(id);
const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('pv', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function put(v) { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('k', 'readwrite'); t.objectStore('k').put(v, 'key'); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
const ready = 'serviceWorker' in navigator ? navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE }).then(() => navigator.serviceWorker.ready) : null;
if (!ready) $('err').textContent = 'This browser cannot open the preview. Please use Safari or Chrome.';
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('pw').value.trim();
  if (!pw || !ready) return;
  $('go').disabled = true; $('go').textContent = 'Opening…'; $('err').textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const salt = Uint8Array.from(atob(SALT), (c) => c.charCodeAt(0));
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER }, base, 256);
    const aes = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const mac = await crypto.subtle.importKey('raw', bits, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const name = hex(await crypto.subtle.sign('HMAC', mac, new TextEncoder().encode('check'))).slice(0, 32);
    const r = await fetch(BASE + 'd/' + name + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('no');
    const b = new Uint8Array(await r.arrayBuffer());
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, aes, b.slice(12));
    await put(new Uint8Array(bits));
    const reg = await ready;
    if (!navigator.serviceWorker.controller) await new Promise((res) => { navigator.serviceWorker.addEventListener('controllerchange', res, { once: true }); setTimeout(res, 3000); });
    (navigator.serviceWorker.controller || reg.active)?.postMessage('key-updated');
    location.reload();
  } catch (err) {
    $('go').disabled = false; $('go').textContent = 'Open';
    $('err').textContent = 'That passphrase is not right. Please try again.';
  }
});
</script></body></html>
